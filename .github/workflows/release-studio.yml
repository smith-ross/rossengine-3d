name: Release Studio

# Builds RossEngine Studio for Windows and publishes it as a GitHub release.
# Ross Launcher installs and updates Studio from the latest release's
# RossEngine-Studio-win32-x64.zip asset.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Prevent two pushes from racing to compute the same "next version".
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 24 (npm 11): npm 10 rejects @luau-rs/luau's optional TypeScript 6 peer
          # alongside the project's TypeScript 7.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Next version = latest release tag, patch bumped by one. The first run
      # (no releases yet) uses package.json's version as-is.
      - name: Determine next version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null)
          if [ -z "$latest_tag" ]; then
            new_version=$(node -p "require('./package.json').version")
          else
            version=${latest_tag#v}
            IFS='.' read -r major minor patch <<< "$version"
            new_version="$major.$minor.$((patch + 1))"
          fi
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$new_version" >> "$GITHUB_OUTPUT"

      - name: Bump package.json version
        shell: bash
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Test
        run: npm test

      - name: Build Studio
        run: npm run build:studio

      # Files sit at the zip root, so the launcher finds "RossEngine Studio.exe" directly.
      - name: Zip Studio
        shell: bash
        run: |
          cd "studio-dist/RossEngine Studio-win32-x64"
          7z a -tzip -mx=7 "$GITHUB_WORKSPACE/RossEngine-Studio-win32-x64.zip" . > /dev/null
          ls -la "$GITHUB_WORKSPACE/RossEngine-Studio-win32-x64.zip"

      # Only commit/tag/release once the build has succeeded.
      - name: Commit version bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "package.json already at ${{ steps.version.outputs.version }}; nothing to commit"
          else
            git commit -m "chore: release ${{ steps.version.outputs.tag }} [skip ci]"
            git push
          fi

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" RossEngine-Studio-win32-x64.zip \
            --title "RossEngine Studio ${{ steps.version.outputs.tag }}" \
            --generate-notes
